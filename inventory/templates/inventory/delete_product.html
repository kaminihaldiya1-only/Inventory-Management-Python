
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Product | Inventory Management</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 30px 15px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1e293b;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: white;
            padding: 35px 30px;
            text-align: center;
            border-radius: 14px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.07);
        }

        .warning-icon {
            width: 65px;
            height: 65px;
            margin: 0 auto 18px;
            background: #fee2e2;
            color: #dc2626;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
        }

        h2 {
            color: #dc2626;
            margin-bottom: 12px;
        }

        .message {
            color: #64748b;
            font-size: 15px;
            line-height: 1.6;
        }

        .product-info {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 18px;
            border-radius: 9px;
            margin: 22px 0;
            text-align: left;
        }

        .product-info h3 {
            margin: 0 0 10px;
            color: #1e293b;
            text-align: center;
        }

        .product-info p {
            margin: 7px 0;
            color: #475569;
            font-size: 14px;
        }

        .warning-text {
            color: #b91c1c;
            background: #fef2f2;
            padding: 11px;
            border-radius: 7px;
            font-size: 13px;
            margin-bottom: 22px;
        }

        .buttons {
            display: flex;
            gap: 12px;
        }

        .btn {
            flex: 1;
            padding: 13px 10px;
            border-radius: 7px;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
            border: none;
            text-align: center;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
        }

        .delete-btn:hover {
            background: #b91c1c;
        }

        .cancel-btn {
            background: #e2e8f0;
            color: #334155;
        }

        .cancel-btn:hover {
            background: #cbd5e1;
        }

        @media (max-width: 450px) {
            .container {
                padding: 25px 20px;
            }

            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="warning-icon">!</div>

    <h2>Delete Product?</h2>

    <p class="message">
        Are you sure you want to delete this product
        from your inventory?
    </p>

    <div class="product-info">

        <h3>{{ product.product_name }}</h3>

        <p>
            <strong>Product Code:</strong>
            {{ product.product_code }}
        </p>

        <p>
            <strong>Category:</strong>
            {{ product.category }}
        </p>

        <p>
            <strong>Quantity:</strong>
            {{ product.quantity }}
        </p>

    </div>

    <div class="warning-text">
        Warning: This action cannot be undone.
    </div>

    <form method="POST">
        {% csrf_token %}

        <div class="buttons">

            <button type="submit" class="btn delete-btn">
                Yes, Delete Product
            </button>

            <a href="{% url 'dashboard' %}" class="btn cancel-btn">
                Cancel
            </a>

        </div>

    </form>

</div>

</body>
</html>
